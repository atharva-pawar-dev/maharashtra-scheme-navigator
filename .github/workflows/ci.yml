name: CI/CD Quality and Security Pipeline

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches:
      - main
      - release/*

permissions:
  contents: read

jobs:
  security-and-lint:
    name: Security Scan & AST Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check src tests

      - name: Run Static Security Audit Scanner (AST)
        run: |
          python scripts/security_audit_scanner.py

  test-suite:
    name: Test Suite & AST Baseline Invariance (G23)
    runs-on: ubuntu-latest
    needs: security-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Verify AST Test Baseline Non-Weakening (Gate G23)
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          baseline_path = Path('release/evidence/baseline/test_inventory.json')
          assert baseline_path.exists(), 'Baseline inventory missing'
          with open(baseline_path, 'r', encoding='utf-8') as f:
              baseline = json.load(f)
          # Count current assertions and test functions
          from tests_ast_counter import count_test_inventory
          current = count_test_inventory(Path('tests'))
          print(f'Baseline assertions: {baseline[\"total_assertions\"]}, Current: {current[\"total_assertions\"]}')
          assert current['total_test_functions'] >= baseline['total_test_functions'], 'Test function count weakened!'
          assert current['total_assertions'] >= baseline['total_assertions'], 'Test assertion count weakened!'
          "

      - name: Run Unit & Integrity Test Suite
        env:
          APP_ENV: test
          LLM_MODE: "off"
          SCHEME_NAVIGATOR_AUTH_SECRET: "ci_pipeline_dummy_test_secret_32_characters_minimum"
        run: |
          pytest tests/ -v --ignore=tests/browser/

  container-verification:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: msn-app:ci-test

      - name: Verify Deployment In-Process
        run: |
          python -m pip install -e .
          python scripts/verify_deployment.py --in-process
