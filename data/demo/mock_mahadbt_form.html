<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scheme Navigator - Mock MahaDBT Application</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #14202b; }
    header { border-bottom: 3px solid #145b9a; margin-bottom: 1.5rem; }
    .banner { background: #fff7dc; border: 1px solid #d5a000; padding: 1rem; border-radius: .5rem; }
    label { display: block; margin: 1rem 0 .3rem; font-weight: 650; }
    input, select { box-sizing: border-box; width: 100%; padding: .7rem; border: 1px solid #8393a0; border-radius: .3rem; }
    button { margin-top: 1.4rem; padding: .8rem 1rem; background: #145b9a; color: white; border: 0; border-radius: .35rem; font-weight: 700; cursor: pointer; }
    #result { margin-top: 1rem; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <h1>Scheme Navigator</h1>
    <p>Local-only mock of a scheme application form</p>
  </header>
  <div class="banner"><strong>Sandbox notice:</strong> This is not the real MahaDBT portal. Data stays in this page; no government application is transmitted.</div>
  <form id="mockForm">
    <label for="fullName">Applicant name</label><input id="fullName" name="fullName" autocomplete="off" required>
    <label for="age">Age (completed years)</label><input id="age" name="age" type="number" min="0" max="120" required>
    <label for="income">Family annual income (INR)</label><input id="income" name="income" type="number" min="0" required>
    <label for="district">District</label><input id="district" name="district" autocomplete="off">
    <label for="gender">Gender</label><select id="gender" name="gender"><option value="">Select</option><option value="female">Female</option><option value="male">Male</option><option value="other">Other</option></select>
    <label for="caste">Caste category (optional)</label><input id="caste" name="caste" autocomplete="off">
    <button type="button" id="simulateSubmit">Human-approved: simulate submission</button>
  </form>
  <p id="result" role="status" aria-live="polite"></p>
  <script>
    document.getElementById('simulateSubmit').addEventListener('click', () => {
      const form = document.getElementById('mockForm');
      if (!form.reportValidity()) return;
      document.getElementById('result').textContent = 'DEMO ONLY: mock submission acknowledged locally. No data was sent to a government portal.';
      document.getElementById('result').dataset.status = 'mock-submitted';
    });
  </script>
</body>
</html>
