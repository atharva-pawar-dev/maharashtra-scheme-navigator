[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scheme-navigator"
version = "0.1.0"
description = "Source-grounded scheme discovery, eligibility audit, document pre-audit, and mock application planner for Maharashtra residents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - replace before distribution" }
authors = [{ name = "Scheme Navigator contributors" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "google-genai>=1.0.0,<3.0.0",
  "httpx>=0.27,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "pypdf>=5.0,<6.0",
  "pymupdf>=1.24,<2.0",
  "PyYAML>=6.0,<7.0",
  "python-multipart>=0.0.9,<1.0",
  "networkx>=3.3,<4.0",
  "rapidfuzz>=3.9,<4.0",
  "jellyfish>=1.0,<2.0",
  "rank-bm25>=0.2.2,<1.0",
  "langgraph>=0.2.50,<2.0",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langchain-core>=0.3,<2.0",
  "qdrant-client>=1.11,<2.0",
  "opencv-python-headless>=4.10,<5.0",
  "Pillow>=10.4,<13.0",
  "numpy>=1.26,<3.0",
  "playwright>=1.48,<2.0",
  "python-json-logger>=2.0,<4.0",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2.0"]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<2.0",
  "coverage>=7.6,<8.0",
]

[project.scripts]
scheme-navigator = "scheme_navigator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scheme_navigator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
